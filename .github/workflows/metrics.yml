name: Metrics

on:
  push:
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/extract-languages.py"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  verify-stng-access:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report accessible private repository count
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          private_ids=$(gh api 'user/repos?visibility=private&per_page=100' --paginate --jq '.[].id')
          private_count=$(printf '%s\n' "$private_ids" | sed '/^$/d' | wc -l)
          echo "::notice title=Metrics token access::Accessible private repositories: $private_count"

      - name: Verify METRICS_TOKEN can read STNG and matching commits
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          gh api repos/Pierre-ESA/SBAS-Teacher-NG --silent
          matching_commits=$(gh api 'repos/Pierre-ESA/SBAS-Teacher-NG/commits?author=bymedeu&per_page=1' --jq 'length')
          if [ "$matching_commits" -eq 0 ]; then
            echo '::error::STNG is accessible, but no commits attributed to bymedeu were found.'
            exit 1
          fi
          echo 'STNG access and at least one commit attributed to bymedeu verified.'

      - name: Verify Lowlighter Git authentication to STNG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if ! GIT_TERMINAL_PROMPT=0 git ls-remote "https://$GH_TOKEN@github.com/Pierre-ESA/SBAS-Teacher-NG" HEAD > /dev/null 2> "$RUNNER_TEMP/stng-git-access.log"; then
            echo '::error::STNG API access succeeded, but Lowlighter-style Git authentication failed.'
            exit 1
          fi
          echo '::notice title=STNG Git access::Lowlighter-style Git authentication succeeded.'

  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: bymedeu
          template: classic
          debug: yes
          config_display: large
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          plugin_languages: yes
          # Analyze matching commits across owned and contributed repositories.
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: Pierre-ESA/SBAS-Teacher-NG
          # Analysis limits are in minutes (global / per repository).
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 10
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, jupyter notebook, Makefile, llvm, M4
          # Keep language statistics focused on representative engineering work.
          plugin_languages_skipped: |
            @use.patterns
            -bymedeu/config*
            -bymedeu/bymedeu
            -bymedeu/amhe.me
            -bymedeu/epita-ing1
          commits_authoring: bymedeu, Amadeo Heaulme, Amadéo Heaulme, Medèu, amadeo.heaulme, Amadéo Héaulme
          plugin_repositories: yes
          plugin_repositories_featured: bymedeu/aurora, bymedeu/mystarceiling

      # Check out the SVG just committed by Lowlighter, then reuse its analysis.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Extract language chart for profile
        run: python3 scripts/extract-languages.py

      - name: Publish language chart
        run: |
          git add github-languages.svg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore: update profile language chart [skip ci]"
            git push
          fi

  diagnose-language-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Inspect completed analysis without publishing raw logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous_run_id=$(gh api "repos/$GH_REPO/actions/workflows/metrics.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].id')
          echo "::notice title=Analysis diagnostic::Inspecting completed run $previous_run_id"
          job_id=$(gh api "repos/$GH_REPO/actions/runs/$previous_run_id/jobs" --jq '.jobs[] | select(.name == "github-metrics") | .id')
          echo "::notice title=Analysis diagnostic::Reading completed metrics job $job_id"
          log_status=$(curl --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --output "$RUNNER_TEMP/metrics-analysis.log" --write-out '%{http_code}' "https://api.github.com/repos/$GH_REPO/actions/jobs/$job_id/logs")
          if [ "$log_status" != 200 ]; then
            echo "::error title=Analysis diagnostic::Job log download returned HTTP $log_status"
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          logs = Path(os.environ['RUNNER_TEMP'], 'metrics-analysis.log').read_text()
          relevant = '\n'.join(line for line in logs.splitlines() if 'SBAS-Teacher-NG' in line or 'SBAS_Teacher_NG' in line)
          requested = 'cloning https://github.com/Pierre-ESA/SBAS-Teacher-NG' in relevant
          cloned = 'cloned https://github.com/Pierre-ESA/SBAS-Teacher-NG' in relevant
          failed = 'failed to clone https://github.com/Pierre-ESA/SBAS-Teacher-NG' in relevant
          print(f'::notice title=STNG analysis::Clone requested: {requested}; clone succeeded: {cloned}; clone failed: {failed}')
          matching = re.findall(r'found (\d+) unique commits[^\n]*SBAS.Teacher.NG', relevant)
          print(f'::notice title=STNG attribution::Matching commit counts in logs: {", ".join(matching) or "not reported"}')
          for phrase in ['Repository not found', 'Authentication failed', 'maximum execution time', 'indepth analysis processed successfully']:
              print(f'::notice title=Language analysis diagnostics::{phrase}: {phrase.lower() in logs.lower()}')
          errors = set()
          for line in logs.splitlines():
              if 'failed to clone https://github.com/Pierre-ESA/SBAS-Teacher-NG' in line or 'fatal:' in line:
                  reason = line.split('fatal:', 1)[-1] if 'fatal:' in line else line.split('failed to clone', 1)[-1]
                  reason = re.sub(r'https?://[^\s\"\x27)]+', '[URL]', reason)
                  reason = re.sub(r'github_pat_[\w]+|gh[pousr]_[\w]+', '[REDACTED]', reason)
                  errors.add(reason.strip())
          for reason in sorted(errors):
              print(f'::notice title=Sanitized Git clone error::{reason}')
          lines = logs.splitlines()
          for index, line in enumerate(lines):
              if 'failed to clone https://github.com/Pierre-ESA/SBAS-Teacher-NG' not in line:
                  continue
              for context in lines[index:index + 10]:
                  context = re.sub(r'https?://[^\s\"\x27)]+', '[URL]', context)
                  context = re.sub(r'github_pat_[\w]+|gh[pousr]_[\w]+', '[REDACTED]', context)
                  print(f'::notice title=Sanitized STNG clone context::{context[:1500]}')
          PY
